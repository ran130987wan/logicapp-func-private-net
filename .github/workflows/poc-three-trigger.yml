name: POC Three Trigger Validation

"on":
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  three-trigger-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FUNCTIONS_WORKER_RUNTIME: dotnet-isolated
      AzureWebJobsStorage: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node.js (for Functions Core Tools)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Azure Functions Core Tools
        run: npm i -g azure-functions-core-tools@4 --unsafe-perm true

      - name: Build function app
        run: dotnet build src/MaintenanceApp/MaintenanceApp.csproj -c Release

      - name: Run three-trigger validation
        shell: bash
        run: |
          set -eo pipefail
          chmod +x development/scripts/test-three-schedules.sh

          log_file="/tmp/func-host.log"
          : > "$log_file"

          pushd src/MaintenanceApp >/dev/null
          func start --dotnet-isolated >"$log_file" 2>&1 &
          func_pid=$!
          popd >/dev/null

          cleanup() {
            if ps -p "$func_pid" >/dev/null 2>&1; then
              kill "$func_pid" >/dev/null 2>&1 || true
              wait "$func_pid" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          ready=0
          for i in $(seq 1 90); do
            if curl -sS http://localhost:7071/admin/host/status >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done

          if [[ "$ready" -ne 1 ]]; then
            echo "Function host did not become ready"
            tail -n 120 "$log_file" || true
            exit 1
          fi

          ./development/scripts/test-three-schedules.sh

          echo "--- host tail ---"
          tail -n 40 "$log_file" || true
