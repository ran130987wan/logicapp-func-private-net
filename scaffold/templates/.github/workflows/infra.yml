name: Infra (Terraform)

on:
  push:
    branches: [main]
    paths:
      - infra/**
  workflow_dispatch:
    inputs:
      apply:
        description: "Run terraform apply (requires explicit trigger)"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      destroy:
        description: "Run terraform destroy (requires explicit trigger)"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    env:
      TF_VARS_FILE: environments/dev/terraform.private.tfvars
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -out tf.plan -var-file=${{ env.TF_VARS_FILE }} -var "subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Terraform apply
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply == 'true' && inputs.destroy == 'false' }}
        run: terraform apply -auto-approve tf.plan

      - name: Terraform destroy
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.destroy == 'true' && inputs.apply == 'false' }}
        run: terraform destroy -auto-approve -var-file=${{ env.TF_VARS_FILE }} -var "subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}"
