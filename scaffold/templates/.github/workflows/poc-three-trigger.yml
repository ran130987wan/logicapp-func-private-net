name: POC Three Trigger Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  three-trigger-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FUNCTIONS_WORKER_RUNTIME: dotnet-isolated
      AzureWebJobsStorage: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Azure Functions Core Tools
        run: npm i -g azure-functions-core-tools@4 --unsafe-perm true

      - name: Build function app
        run: dotnet build src/MaintenanceApp/MaintenanceApp.csproj -c Release

      - name: Validate three-trigger behavior
        run: ./development/scripts/test-three-schedules.sh
